<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#FBD8D9">
<title>伊娜小金庫 - 重新連線中</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; width: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
    background: #FBD8D9;
    color: #A04F49;
    overflow: hidden;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  /* === 頂部 5 個純實心愛心（透明，無圓圈）flex 均分間距、整齊排列 === */
  .deco-row {
    position: absolute;
    top: 6%;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 16px;            /* 愛心間距（像字距一樣均勻） */
    pointer-events: none;
    z-index: 3;
  }
  .deco {
    width: 22px;
    height: 22px;
    opacity: .6;
    animation: floatUp 3.2s ease-in-out infinite;
  }
  .deco.d1, .deco.d2, .deco.d3, .deco.d4, .deco.d5 { animation-delay: 0s; }

  @keyframes floatUp {
    0%, 100% { transform: translateY(0)     scale(1);    opacity: .5; }
    50%      { transform: translateY(-10px) scale(1.08); opacity: .8; }
  }

  /* === 主體容器 === */
  .wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 22px;
    text-align: center;
    z-index: 2;
  }

  /* === 中央圖片（透明顯示，無容器） === */
  .hero-img {
    width: 240px;
    max-width: 60vw;
    height: auto;
    display: block;
    animation: breathe 2.6s ease-in-out infinite;
    filter: drop-shadow(0 6px 14px rgba(160, 79, 73, .12));
  }
  @keyframes breathe {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.04); }
  }

  /* === 文字塊 === */
  .title    { font-size: 22px; font-weight: 700; letter-spacing: 1px; line-height: 1.4; }
  .subtitle { font-size: 16px; font-weight: 500; letter-spacing: 1px; }
  .hint     { font-size: 13px; letter-spacing: .5px; opacity: .75; }

  /* === 加載圓點 === */
  .dots {
    display: flex;
    gap: 8px;
    margin-top: 26px;
  }
  .dots span {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #A04F49;
    opacity: .65;
    animation: dotPulse 1.2s ease-in-out infinite;
  }
  .dots span:nth-child(2) { animation-delay: .2s; }
  .dots span:nth-child(3) { animation-delay: .4s; }
  @keyframes dotPulse {
    0%, 100% { transform: scale(1);    opacity: .45; }
    50%      { transform: scale(1.35); opacity: .9;  }
  }

  /* === 小屏適配 === */
  @media (max-width: 380px) {
    .hero-img { width: 200px; }
    .title    { font-size: 20px; }
    .subtitle { font-size: 15px; }
  }
</style>
</head>
